name: 'TypeScript Cache Action'
description: 'A Github Action to cache Typescript `tsc --build` for incremental runs'
branding:
  icon: 'arrow-left-circle'
  color: 'gray-dark'

inputs:
  cache-base-key:
    description: 'Base cache key for restoring cache'
    required: false
    default: ''
  cache-key:
    description: 'cache key for restoring cache'
    required: false
    default: ''
  base-ref:
    description: 'Base ref for restoring cache'
    required: false
    default: 'main'
  files:
    description: 'Cache for tsc output files'
    required: true
  
runs:
  using: 'composite'
  steps:
    - name: get ref
      shell: bash
      run: git fetch origin ${{ inputs.base-ref }}:${{ inputs.base-ref }}

    - name: restore tsc build cache
      id: tsc-build-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.files }}
        key: ${{ inputs.cache-base-key }}-${{ inputs.cache-key }}
        restore-keys: |
          ${{ inputs.cache-base-key }}-${{ inputs.cache-key }}
          ${{ inputs.cache-base-key }}
    # `touch -t` reads a wall clock with no zone on it, so whatever renders that string has to
    # agree with `touch` about the zone. Plain `format` uses the commit's own, which for a
    # commit made at +0100 against a UTC runner stamps every file an hour ahead -- ahead of
    # "now" for a job starting within that hour, leaving the changed files touched below older
    # than everything else and tsc skipping the very projects it was meant to rebuild.
    # TZ pins both sides to UTC rather than merely to the same zone, since a zone observing DST
    # has an hour each autumn that a bare wall clock cannot name unambiguously.
    - name: restore timestamps of all files to base branch commit
      shell: bash
      env:
        TZ: UTC
      run: find . -type f -exec touch -c -m -t $(git log -1 --format=%cd --date=format-local:%y%m%d%H%M.%S ${{ inputs.base-ref }}) {} +

    - name: changed source files 
      uses: tj-actions/changed-files@v45
      id: changed-source-files
      with:
        base_sha: ${{ inputs.base-ref }}
    - name: restore timestamps to source files with head ref timestamp
      if: steps.changed-source-files.outputs.any_changed == 'true'
      shell: bash
      run: touch -c -m ${{ steps.changed-source-files.outputs.all_changed_files }}